# Code stays in the system bank while graphics and assets change banks.
MEMORY {
    ZP:   start = $0040, size = $0040, file = "";
    LOW:  start = $A200, size = $1E00, file = %O, fill = yes;
    HIGH: start = $D000, size = $2000, file = %O, fill = yes;
    SPRITES: start = $0200, size = $0600, file = "";
    RAM:  start = $0800, size = $1000, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    STARTUP: load = LOW, type = ro;
    RENDER: load = LOW, type = ro;
    LOWCODE: load = LOW, type = ro, optional = yes;
    RODATA: load = LOW, type = ro;
    DATA: load = LOW, type = rw;
    ONCE: load = HIGH, type = ro, optional = yes;
    CODE: load = HIGH, type = ro;
    SPRITECACHE: load = SPRITES, type = bss;
    BSS: load = RAM, type = bss, define = yes;
}
