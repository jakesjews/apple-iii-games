# Native bank 0: pixels at $2000, color attributes at $4000, program at $6000.
# System bank: game variables at $A200; cc65 software stack below $C000.
MEMORY {
    ZP:   start = $0040, size = $0040, file = "";
    MAIN: start = $6000, size = $4000, file = %O;
    RAM:  start = $A200, size = $1600, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro, optional = yes;
    ONCE:     load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = RAM, type = bss, define = yes;
}
